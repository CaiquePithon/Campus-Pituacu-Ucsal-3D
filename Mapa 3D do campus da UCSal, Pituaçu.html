<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mapa 3D do campus da UCSal, Pituaçu</title>
    <style>
      :root {
        --bg: #dde7df;
        --ink: #14261c;
        --panel: rgba(255, 255, 255, 0.84);
        --line: rgba(20, 38, 28, 0.2);
        --acc: #1f6b45;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1a14;
          --ink: #e6f0ea;
          --panel: rgba(16, 30, 23, 0.84);
          --line: rgba(230, 240, 234, 0.22);
          --acc: #7fd1a0;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1a14;
        --ink: #e6f0ea;
        --panel: rgba(16, 30, 23, 0.84);
        --line: rgba(230, 240, 234, 0.22);
        --acc: #7fd1a0;
      }
      html {
        height: 100%;
      }
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 system-ui,
          sans-serif;
        overflow: hidden;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ld {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 15px;
      }
      #p {
        position: fixed;
        left: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        width: min(290px, calc(100vw - 24px));
        box-sizing: border-box;
        padding: 14px 16px;
        background: var(--panel);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      h1 {
        font:
          600 19px/1.2 ui-serif,
          Georgia,
          serif;
        margin: 0 0 6px;
      }
      #p p,
      #p small {
        margin: 0 0 10px;
        font-size: 13px;
        opacity: 0.8;
        display: block;
      }
      #p small {
        margin: 10px 0 0;
        font-size: 12px;
      }
      label {
        display: block;
        margin: 0 0 8px;
      }
      input {
        accent-color: var(--acc);
      }
      input[type="range"] {
        display: block;
        width: 100%;
        margin: 4px 0 0;
      }
      .b {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line);
        padding: 7px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: var(--acc);
        color: var(--bg);
      }
      .l {
        position: fixed;
        left: 0;
        top: 0;
        display: none;
        pointer-events: none;
        padding: 2px 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 5px;
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ld">Montando o relevo…</div>
    <section id="p">
      <h1>Campus da UCSal, Pituaçu</h1>
      <p>
        O mapa segue as áreas que você marcou na imagem. As alturas do relevo e
        dos prédios são aproximadas.
      </p>
      <label
        >Exagero do relevo<input
          id="k"
          type="range"
          min=".4"
          max="2.5"
          step=".1"
          value="1"
      /></label>
      <div class="b" style="margin: 0 0 10px">
        <label style="margin: 0"
          ><input id="t" type="checkbox" checked /> Árvores</label
        ><label style="margin: 0"
          ><input id="q" type="checkbox" checked /> Carros</label
        ><label style="margin: 0"
          ><input id="l" type="checkbox" checked /> Rótulos</label
        >
      </div>
      <div class="b">
        <button id="v1">Vista inclinada</button
        ><button id="v2">Vista de cima</button>
      </div>
      <small
        >Arraste para girar, role ou use dois dedos para aproximar, botão
        direito para mover.</small
      >
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id),
          cvs = $("c");
        const rd = new THREE.WebGLRenderer({
          canvas: cvs,
          antialias: true,
          alpha: true,
        });
        rd.setPixelRatio(Math.min(devicePixelRatio, 2));
        rd.outputEncoding = THREE.sRGBEncoding;
        const scene = new THREE.Scene(),
          cam = new THREE.PerspectiveCamera(45, 1, 1, 2000);
        scene.fog = new THREE.Fog(
          new THREE.Color(
            getComputedStyle(document.documentElement)
              .getPropertyValue("--bg")
              .trim(),
          ).convertSRGBToLinear(),
          380,
          1000,
        );
        scene.add(new THREE.HemisphereLight(0xffffff, 0x5a6a5a, 0.6));
        const sun = new THREE.DirectionalLight(0xfff2dd, 0.45);
        sun.position.set(-120, 200, 80);
        scene.add(sun);
        const ctl = new THREE.OrbitControls(cam, cvs);
        ctl.enableDamping = true;
        ctl.maxPolarAngle = 1.5;
        ctl.minDistance = 15;
        ctl.maxDistance = 600;
        const go = (p, t) => {
          cam.position.set(...p);
          ctl.target.set(...t);
          ctl.update();
        };
        const rs = () => {
          rd.setSize(cvs.clientWidth, cvs.clientHeight, false);
          cam.aspect = cvs.clientWidth / cvs.clientHeight;
          cam.updateProjectionMatrix();
        };
        addEventListener("resize", rs);
        rs();
        go([-95, 150, 230], [10, 0, -10]);
        (function loop() {
          requestAnimationFrame(loop);
          ctl.update();
          rd.render(scene, cam);
          if (window.tick) tick();
        })();
        $("v1").onclick = () => go([-95, 150, 230], [10, 0, -10]);
        $("v2").onclick = () => go([10, 430, -9], [10, 0, -10]);

            (((((c / 6) | 0) * 73856093) ^ (((r / 6) | 0) * 19349663)) >>> 0) %
            4;
          const bi = [];
          for (let n = 0; n < N; n++)
            if (cls[n] === 3 || cls[n] === 4) bi.push(n);
          const bm = new THREE.InstancedMesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshLambertMaterial(),
            bi.length,
          );
          bi.forEach((n, k) => {
            const r = (n / cols) | 0,
              c = n % cols;
            let [R, G, B] = P(r, c),
              hh;
            if (cls[n] === 3) {
              hh = 11;
              R = 228 + Math.random() * 10;
              G = 212 + Math.random() * 10;
              B = 104;
            } else {
              hh = 4 + hs(c, r);
              if ((R + G + B) / 3 < 95 || G > R + 8) {
                R = G = B = 175;
              }
            }
            o.position.set(X(c), hh / 2, Z(r));
            o.scale.set(1.06, hh, 1.06);
            o.updateMatrix();
            bm.setMatrixAt(k, o.matrix);
            bm.setColorAt(k, tint(R, G, B, 1));
          });
          world.add(bm);

          // árvores: mata marcada e algumas no pátio do campus
          const ti = [];
          for (let r = 2; r < rows - 2; r += 2)
            for (let c = 2; c < cols - 2; c += 2) {
              const n = r * cols + c,
                k = cls[n];
              if (k === 1 && d[n] > 1.2) ti.push(n);
              else if (k === 0 && ((r + c) >> 1) % 2 === 0) {
                const [R, G, B] = P(r, c);
                if (G >= R + 3 && (R + G + B) / 3 < 125) ti.push(n);
              }
            }
          const cg = new THREE.ConeGeometry(1, 1, 6);
          cg.translate(0, 0.5, 0);
          const trees = new THREE.InstancedMesh(
            cg,
            new THREE.MeshLambertMaterial(),
            ti.length,
          );
          ti.forEach((n, k) => {
            const r = (n / cols) | 0,
              c = n % cols,
              [R, G, B] = P(r, c),
              rad = 1.4 + Math.random() * 0.8,
              ht = 3.5 + Math.random() * 3;
            o.position.set(
              X(c) + (Math.random() - 0.5) * 1.6,
              h[n] - 0.3,
              Z(r) + (Math.random() - 0.5) * 1.6,
            );
            o.scale.set(rad, ht, rad);
            o.updateMatrix();
            trees.setMatrixAt(k, o.matrix);
            trees.setColorAt(k, tint(R, G, B, 1.2 + Math.random() * 0.25));
          });
          world.add(trees);

          // carros na garagem (classe 7)
          const pal = [
              0xf2f2f2, 0xf2f2f2, 0xd6d9dc, 0xd6d9dc, 0x2b2d31, 0x2b2d31,
              0x8d9298, 0x1c3f6e, 0xa8252b, 0xc9c3b4,
            ],
            cr = [];
          for (let j = 8, a = 0; j < H - 12; j += 8, a++)
            for (let i = 8, b = 0; i < W - 8; i += 5, b++) {
              if (b % 5 === 4 || a % 7 === 6 || Math.random() < 0.12) continue;
              if (
                M[j * W + i] === 7 &&
                M[(j + 7) * W + i] === 7 &&
                M[j * W + i + 3] === 7 &&
                M[(j + 7) * W + i + 3] === 7
              )
                cr.push([i + 1.5, j + 3.5]);
            }
          const cb = new THREE.InstancedMesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshLambertMaterial(),
            cr.length,
          );
          const cc = new THREE.InstancedMesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshLambertMaterial({ color: 0x34414c }),
            cr.length,
          );
          cr.forEach(([i, j], k) => {
            const x =
                (i / (W - 1) - 0.5) * W * S + (Math.random() - 0.5) * 0.25,
              z = (j / (H - 1) - 0.5) * H * S;
            o.position.set(x, 0.45, z);
            o.scale.set(1.2, 0.9, 2.6);
            o.updateMatrix();
            cb.setMatrixAt(k, o.matrix);
            cb.setColorAt(
              k,
              col
                .setHex(pal[(Math.random() * pal.length) | 0])
                .convertSRGBToLinear(),
            );
            o.position.set(x, 1.1, z + 0.1);
            o.scale.set(1, 0.5, 1.3);
            o.updateMatrix();
            cc.setMatrixAt(k, o.matrix);
          });
          world.add(cb, cc);

          // portão de entrada (classe 5)
          {
            let a = [1e9, 1e9, -1, -1];
            for (let j = 0; j < H; j++)
              for (let i = 0; i < W; i++)
                if (M[j * W + i] === 5)
                  a = [
                    Math.min(a[0], i),
                    Math.min(a[1], j),
                    Math.max(a[2], i),
                    Math.max(a[3], j),
                  ];
            if (false) {
              const wx = (a[2] - a[0]) * S,
                wz = (a[3] - a[1]) * S,
                al = wx >= wz,
                L = Math.max(al ? wx : wz, 9),
                pm = new THREE.MeshLambertMaterial({ color: 0xefe9dc }),
                gate = new THREE.Group();
              [-1, 1].forEach((s) => {
                const p = new THREE.Mesh(
                  new THREE.BoxGeometry(1.8, 8, 1.8),
                  pm,
                );
                p.position.set(al ? (s * L) / 2 : 0, 4, al ? 0 : (s * L) / 2);
                gate.add(p);
              });
              const bb = new THREE.Mesh(
                new THREE.BoxGeometry(
                  al ? L + 1.8 : 2.2,
                  1.6,
                  al ? 2.2 : L + 1.8,
                ),
                new THREE.MeshLambertMaterial({ color: 0xd9648f }),
              );
              bb.position.y = 8.4;
              gate.add(bb);
              gate.position.set(
                ((a[0] + a[2]) / 2 / (W - 1) - 0.5) * W * S,
                0,
                ((a[1] + a[3]) / 2 / (H - 1) - 0.5) * H * S,
              );
              world.add(gate);
            }
          }

          // água do rio
          const wt = new THREE.Mesh(
            new THREE.PlaneGeometry(W * S, H * S),
            new THREE.MeshLambertMaterial({
              color: 0x8d6e4f,
              transparent: true,
              opacity: 0.85,
            }),
          );
          wt.rotation.x = -Math.PI / 2;
          wt.position.y = -1.8;
          world.add(wt);

          // rótulos
          const anc = (cl, y) => {
            let sx = 0,
              sy = 0,
              n = 0;
            for (let k = 0; k < W * H; k++)
              if (M[k] === cl && (cl !== 4 || k < W * 160)) {
                sx += k % W;
                sy += (k / W) | 0;
                n++;
              }
            if (!n) return null;
            sx /= n;
            sy /= n;
            let bd = 1e18,
              bi2 = 0,
              bj = 0;
            for (let k = 0; k < W * H; k++)
              if (M[k] === cl && (cl !== 4 || k < W * 160)) {
                const i = k % W,
                  j = (k / W) | 0,
                  dd = (i - sx) ** 2 + (j - sy) ** 2;
                if (dd < bd) {
                  bd = dd;
                  bi2 = i;
                  bj = j;
                }
              }
            return new THREE.Vector3(
              (bi2 / (W - 1) - 0.5) * W * S,
              y,
              (bj / (H - 1) - 0.5) * H * S,
            );
          };
          const lab = [
            ["Bloco A", 0, 10, 172, 53],
            ["Biblioteca", 0, 10, 172, 85],
            ["Bloco C", 0, 10, 171, 220],
            ["Auditorio", 0, 10, 146, 300],
            ["Bloco B", 0, 14, 298, 322],
            ["Vila Universitaria", 0, 9, 263, 440],
            ["Garagem", 0, 6, 174, 521],
            ["Rio", 0, 3, 363, 608],
            ["Estrada", 0, 4, 335, 98],
          ]
            .map(([t, k, y, i, j]) => {
              const p =
                i == null
                  ? anc(k, y)
                  : new THREE.Vector3(
                      (i / (W - 1) - 0.5) * W * S,
                      y,
                      (j / (H - 1) - 0.5) * H * S,
                    );
              if (!p) return null;
              const e = document.createElement("div");
              e.className = "l";
              e.textContent = t;
              document.body.append(e);
              return { e, p };
            })
            .filter(Boolean);
          const v3 = new THREE.Vector3();
          window.tick = () => {
            const w = cvs.clientWidth,
              hh = cvs.clientHeight;
            lab.forEach(({ e, p }) => {
              v3.set(p.x, p.y * world.scale.y, p.z).project(cam);
              const ok = v3.z < 1 && $("l").checked;
              e.style.display = ok ? "block" : "none";
              if (ok)
                e.style.transform = `translate(${(v3.x * 0.5 + 0.5) * w}px,${(-v3.y * 0.5 + 0.5) * hh}px) translate(-50%,-100%)`;
            });
          };

          $("k").oninput = (e) => {
            world.scale.y = +e.target.value;
          };
          $("t").onchange = (e) => {
            trees.visible = e.target.checked;
          };
          $("q").onchange = (e) => {
            cb.visible = cc.visible = e.target.checked;
          };
          $("ld").remove();
        }
      })();
    </script>
  </body>
</html>
